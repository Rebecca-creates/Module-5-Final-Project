<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/d77651993d.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </head>

  <body>
    <section>
      <nav>
        <div class="nav__container">
          <div class="logo">
            <img class="logo__image" src="assets/popcorn.png" />
            <h4 class="logo__name">FilmArchive</h4>
          </div>
          <ul class="nav__links">
            <li>
              <a href="" target="_blank" class="nav__link">Search</a>
            </li>
            <li>
              <a href="" class="nav__link">About</a>
            </li>
            <li>
              <a class="nav__link btn__contact">Contact</a>
            </li>
          </ul>
          <button class="burger" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
          </button>
        </div>
      </nav>
    </section>

    <section id="landing__page">
      <div class="content__wrapper">
        <h2 class="welcome__title">Welcome to FilmArchive</h2>
        <p class="welcome__para">
          We have millions of titles for you to explore. Find your next watch
          here!
        </p>
        <div class="row">
          <input class="search__input" placeholder="Search for a movie..." />
          <button class="btn search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
      <div class="img__container">
        <img src="assets/cinema_img.jpg" class="cinema__img" />
      </div>
    </section>
  </body>
</html>
